name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows TypeScript
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up the declared npm version
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Check Windows adapter and shared UI
        run: npm run check:toolchain && npm run check:error-contract && npm run typecheck && npm run lint && npm test && npm run audit:dependencies

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up the declared npm version
        uses: ./.github/actions/setup-npm

      # Keep hosted builds on the stable Xcode toolchain shipped by the pinned runner image.
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # PR caches are scoped to their merge ref, so untrusted changes cannot overwrite main's cache.
      - name: Restore Swift build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            swift/.raycast-swift-build
            swift/ScannerKit/.build
            cli/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-${{ hashFiles('swift/Package.resolved', 'swift/**/Package.swift', 'cli/Package.swift') }}

      - name: Install dependencies
        run: npm ci

      - name: Check native error contract
        run: npm run check:error-contract

      - name: Lint
        run: npm run lint

      - name: Test TypeScript
        run: npm test

      - name: Test Swift
        run: npm run test:swift

      - name: Build extension
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:dependencies

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
