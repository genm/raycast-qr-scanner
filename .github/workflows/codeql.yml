name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-latest
            timeout: 15
            build-mode: none

          - language: swift
            runner: macos-15
            # A cold, CodeQL-instrumented Swift bridge build can exceed the normal CI budget.
            timeout: 60
            build-mode: manual

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Select Xcode 16.4
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build Swift targets for CodeQL
        if: matrix.language == 'swift'
        run: |
          # CodeQL needs compiler-visible Swift sources, not Raycast packaging.
          # CI still runs `npm run build` to validate the Store build separately.
          swift build --package-path swift
          swift build --package-path cli

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
