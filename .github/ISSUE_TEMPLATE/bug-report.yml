name: Bug report
description: Report a reproducible problem with QR Scanner.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include QR payloads, Wi-Fi passwords, clipboard content, secrets, or unredacted desktop screenshots.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the Raycast Store version or commit SHA you tested.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Raycast, Node.js, and Xcode versions as applicable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sanitized or generated test data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
      description: Redact personal data, paths, QR content, and unrelated desktop content.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private QR content, personal data, and unrelated screen content.
          required: true
