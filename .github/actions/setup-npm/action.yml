name: Set up declared npm
description: Install the package.json npm version outside the hosted Node.js toolcache

runs:
  using: composite
  steps:
    - name: Install npm
      shell: bash
      run: |
        npm_version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
        npm_prefix="${RUNNER_TEMP}/npm-${npm_version}"
        npm install --global --prefix "${npm_prefix}" "npm@${npm_version}" --ignore-scripts
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          npm_bin="${npm_prefix}"
        else
          npm_bin="${npm_prefix}/bin"
        fi
        echo "${npm_bin}" >> "${GITHUB_PATH}"
        test "$("${npm_bin}/npm" --version)" = "${npm_version}"
